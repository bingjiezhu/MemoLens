name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # setup-python on ubuntu-24.04 links CPython's sqlite3 module to the
      # runner's SQLite 3.45.x. That branch lacks the upstream WAL-reset fix,
      # so changing only the Python minor cannot admit this writer lane. Build
      # a pinned upstream shared library, verify the official SHA3-256 digest,
      # then let the next step attest the library CPython actually loads.
      - name: Provision admitted SQLite writer library
        env:
          SQLITE_AUTOCONF: "3530400"
          SQLITE_AUTOCONF_SHA3_256: "454e45f61c6bd75b7420e7190732dea03ce6639c63ada47bbc592f67fc340338"
        run: |
          archive="${RUNNER_TEMP}/sqlite-autoconf-${SQLITE_AUTOCONF}.tar.gz"
          source_dir="${RUNNER_TEMP}/sqlite-autoconf-${SQLITE_AUTOCONF}"
          install_dir="${RUNNER_TEMP}/memolens-sqlite-runtime"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://www.sqlite.org/2026/sqlite-autoconf-${SQLITE_AUTOCONF}.tar.gz"
          SQLITE_ARCHIVE="${archive}" python -I - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          archive = Path(os.environ["SQLITE_ARCHIVE"])
          expected = os.environ["SQLITE_AUTOCONF_SHA3_256"]
          observed = hashlib.sha3_256(archive.read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(
                  f"SQLite source digest mismatch: expected {expected}, observed {observed}"
              )
          PY
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          cd "${source_dir}"
          ./configure \
            --prefix="${install_dir}" \
            --disable-static
          make -C "${source_dir}" -j2
          make -C "${source_dir}" install
          echo "LD_LIBRARY_PATH=${install_dir}/lib" >> "${GITHUB_ENV}"
      - name: Admit SQLite WAL runtime
        run: >-
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONINSPECT
          -u PYTHONSTARTUP -u PYTHONUSERBASE
          python -I scripts/check_sqlite_runtime.py --json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Install Photon dependencies for production oracles
        run: npm ci
        working-directory: photon-bot
      - run: npm run lint:python
      - run: npm run audit:deps
      - run: npm run test:unit
      - run: npm run test:plugin
      - run: npm run test:plugin-package
      - run: npm run test:production-oracles
      - run: npm run test:smoke
      - run: npm run build
      - run: npm run test:electron

  plugin-python310:
    name: Read-only stdlib plugin compatibility (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # The three plugin-directory writer integration files import backend/core
      # MediaRepository and remain covered by the admitted Python 3.14 app job.
      # This lane proves that the shipped read-only/transport plugin surface
      # itself retains its declared Python 3.10 standard-library boundary.
      - name: Run standard-library plugin compatibility tests directly
        run: |
          for test_file in \
            test_agent_pairing.py \
            test_creative_blueprint.py \
            test_media_wiki.py \
            test_plugin.py \
            test_project_resume.py \
            test_strict_json.py \
            test_video_timeline.py
          do
            python -m unittest discover \
              -s .agents/plugins/plugins/memolens/tests \
              -p "${test_file}" \
              -v
          done

  photon-bot:
    name: Photon Bot build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: photon-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: photon-bot/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  macos-desktop-runtime:
    name: macOS desktop runtime
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # setup-python 3.14.7 on this runner links SQLite 3.50.4, which fails
      # admission. Homebrew Python links its maintained SQLite dependency.
      # Attest the actual library rather than bypassing or mocking the gate.
      - name: Prepare admitted Homebrew Python
        run: |
          brew install python@3.14 sqlite
          python_bin="$(brew --prefix python@3.14)/bin/python3.14"
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONINSPECT \
            -u PYTHONSTARTUP -u PYTHONUSERBASE \
            "${python_bin}" -I scripts/check_sqlite_runtime.py --json
          "${python_bin}" -m venv .venv
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: >-
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONINSPECT
          -u PYTHONSTARTUP -u PYTHONUSERBASE
          .venv/bin/python -I scripts/check_sqlite_runtime.py --json
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: bash scripts/prepare_desktop_runtime.sh
      - run: .venv/bin/python -m unittest tests.test_video_media tests.test_demo_media_generator -v
      - run: npm run test:electron
