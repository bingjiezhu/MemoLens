name: Bug report
description: Report a reproducible MemoLens problem without attaching private photos or secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve MemoLens. Remove personal paths, API keys, photo metadata, and private images before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Electron desktop app
        - Browser + local backend
        - Codex plugin
        - Photon Bot
        - Indexing or retrieval backend
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a synthetic or redacted library when possible.
      placeholder: "1. Start MemoLens…\n2. Choose…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include OS, Node/Python versions, logs, or screenshots after removing secrets and private paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, personal paths, private photo content, and sensitive metadata.
          required: true
