  </defs>
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#canvas)" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="64" cy="57" r="37" fill="#F7F6FF"/>
  <circle cx="64" cy="57" r="29" fill="url(#lens)"/>
