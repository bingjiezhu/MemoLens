app:
  image_library_dir: ./local-photo-library
  sqlite_db_path: null
  process_image_width: 512

embedding:
  backend: semantic_hash
  semantic_dimensions: 512
  device: null
  clip_model_id: openai/clip-vit-base-patch32
  dino_model_id: facebook/dinov2-base
  text_model_id: semantic-hash-v1
  text_device: null
  text_query_prefix: "search_query: "
  text_document_prefix: "search_document: "
  text_max_length: 512

geocode:
  enabled: false
  user_agent: memolens-local/0.1

retrieval:
  semantic_hints:
    santa monica park:
      - ferris wheel
      - amusement park
      - pier
      - beach
      - pacific park
    santa monica pier:
      - ferris wheel
      - amusement park
      - beach
      - pacific park
    pacific park:
      - ferris wheel
      - santa monica pier
      - amusement park

vlm:
  vision_active: minimax_vl01
  query_active: minimax_m27
  profiles:
    openai_gpt41_mini:
      label: GPT-4.1 mini (API / OpenAI)
      provider: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4.1-mini
      execution: api
      capabilities: [text, image]
      summary: Flexible API fallback for text planning and multimodal tasks.
      temperature: 0.1
      max_tokens: 400
      response_format:
        type: json_object
    ollama_qwen35_27b:
      label: Qwen 3.5 27B (Local / Ollama)
      provider: ollama
      base_url: http://localhost:11434/v1
